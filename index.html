<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gacha Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/themes.css" />
</head>
<body>
  <div id="app">
    <header class="site-header">
      <div class="header-inner">
        <div class="logo">
          <span class="logo-gem">✦</span>
          <span class="logo-text">Gacha<em>Planner</em></span>
        </div>
        <nav class="game-tabs" id="gameTabs"></nav>
        <div class="header-actions">
          <button class="btn-icon" id="btnExport" title="Export wishlist">⬆</button>
          <button class="btn-icon" id="btnImport" title="Import wishlist">⬇</button>
        </div>
      </div>
    </header>

    <div class="theme-strip" id="themeStrip"></div>

    <main class="main-content">
      <section class="panel panel-browser">
        <div class="panel-head">
          <h2 class="panel-title">Characters</h2>
          <span class="char-count" id="charCount"></span>
        </div>
        <div class="browser-controls">
          <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Search…" autocomplete="off" />
          </div>
          <div class="filter-pills" id="filterRarity">
            <button class="pill active" data-filter-rarity="all">All</button>
            <button class="pill" data-filter-rarity="5">5★</button>
            <button class="pill" data-filter-rarity="4">4★</button>
          </div>
          <div class="filter-pills" id="filterElement"></div>
          <div class="filter-pills" id="filterSpecialty"></div>
        </div>
        <div class="char-grid" id="charGrid"></div>
      </section>

      <section class="panel panel-wishlist">
        <div class="panel-head">
          <h2 class="panel-title">Wishlist</h2>
          <span class="char-count" id="wishCount">0 entries</span>
        </div>
        <div class="wishlist-body" id="wishlistBody">
          <div class="wish-empty">
            <div class="wish-empty-glyph">✦</div>
            <p>Add characters from the list</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <input type="file" id="importInput" accept=".json" style="display:none" />

  <script src="js/data.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
