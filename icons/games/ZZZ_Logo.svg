<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 32">
  <defs>
    <linearGradient id="zg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe090"/>
      <stop offset="100%" stop-color="#e09000"/>
    </linearGradient>
  </defs>
  <!-- Three Z letters stacked -->
  <text x="5" y="15" font-family="Impact, sans-serif" font-size="10" fill="url(#zg)" opacity="0.5">Z</text>
  <text x="10" y="21" font-family="Impact, sans-serif" font-size="12" fill="url(#zg)" opacity="0.75">Z</text>
  <text x="16" y="28" font-family="Impact, sans-serif" font-size="14" fill="url(#zg)">Z</text>
  <!-- Text -->
  <text x="34" y="14" font-family="Georgia, serif" font-size="9" font-weight="bold"
        fill="url(#zg)" letter-spacing="0.5">ZENLESS</text>
  <text x="34" y="25" font-family="Georgia, serif" font-size="9" font-weight="bold"
        fill="url(#zg)" letter-spacing="0.3">ZONE ZERO</text>
</svg>